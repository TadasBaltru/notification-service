services:
  app:
    build:
      context: .
      target: dev
    image: notification-service:dev
    restart: unless-stopped
    # .env.local (gitignored, template in .env.local.dist) is the switch for Xdebug and secrets.
    # Without the file the image default XDEBUG_MODE=off applies. An `environment:` key overrides
    # env_file for that name even when empty, so XDEBUG_MODE is not listed here.
    # RUN_MIGRATIONS is app-only: the worker must not race schema changes.
    environment:
      RUN_MIGRATIONS: "1"
    env_file:
      - path: .env.local
        required: false
    volumes:
      - ./:/app
    ports:
      - "${HTTP_PORT:-18080}:80"
    extra_hosts:
      # Lets Xdebug reach the IDE on Linux hosts
      - host.docker.internal:host-gateway
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      # The first start installs Composer dependencies before serving anything.
      start_period: 30s

  # Same image and volume as app. Consumes DeliverNotification; the time limit recycles the process.
  worker:
    build:
      context: .
      target: dev
    image: notification-service:dev
    restart: unless-stopped
    command: ["bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    env_file:
      - path: .env.local
        required: false
    volumes:
      - ./:/app
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      app:
        condition: service_healthy
      mailpit:
        condition: service_started
    # The image healthchecks Caddy on :2019. This process is the console consumer, so that check
    # is replaced. `docker compose up --wait` (make run) errors when a service has none.
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -q '[m]essenger:consume'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "18025:8025"
      - "1025:1025"

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: app
    # The application reaches the database over the Compose network, so no host port is
    # published by default. Uncomment this to connect a GUI client from your host.
    #ports:
    #  - "${DATABASE_PORT:-13306}:3306"
    volumes:
      - database_data:/var/lib/mysql
      # Creates app_test and grants it to `app`; only executed when the volume is first initialised
      # (docker compose down -v to re-run).
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database_data:
