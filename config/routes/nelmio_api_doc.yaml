# Served in every environment: evaluators run the default image and the UI is the deliverable.
# Unauthenticated by design (README assumption). Behind a real gateway this file would be restricted.
app.swagger_ui:
    path: /api/doc
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }

app.swagger:
    path: /api/doc.json
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger }
