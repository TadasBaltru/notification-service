parameters:
    notifications.channels:
        email:
            enabled: '%env(bool:NOTIFICATIONS_EMAIL_ENABLED)%'
            strategy: priority
            providers: '%env(csv:NOTIFICATIONS_EMAIL_PROVIDERS)%'
        sms:
            enabled: '%env(bool:NOTIFICATIONS_SMS_ENABLED)%'
            strategy: round_robin
            providers: '%env(csv:NOTIFICATIONS_SMS_PROVIDERS)%'
    notifications.throttle:
        limit: '%env(int:NOTIFICATIONS_THROTTLE_LIMIT)%'
        interval: '%env(NOTIFICATIONS_THROTTLE_INTERVAL)%'
    notifications.recipients:
        user-1:
            email: 'user1@example.test'
            phone: '+37060000001'
        user-email-only:
            email: 'email-only@example.test'
