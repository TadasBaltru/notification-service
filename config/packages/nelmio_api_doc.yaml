nelmio_api_doc:
    documentation:
        info:
            title: Notification Service
            version: '%env(default:app_version_default:APP_VERSION)%'
            description: >
                Accept a notification with POST /notifications (HTTP 202). Delivery is asynchronous;
                poll GET /notifications/{id} for per-channel status and attempt history.
                GET /users/{userId}/notifications lists that user's notifications, optionally since a date-time.
        servers:
            - url: /
              description: Relative to the host serving this application
    models:
        names:
            - { alias: Problem, type: App\NotificationPublisher\UserInterface\Http\OpenApi\ProblemSchema }
            - { alias: Notification, type: App\NotificationPublisher\UserInterface\Http\OpenApi\NotificationSchema }
            - { alias: Delivery, type: App\NotificationPublisher\UserInterface\Http\OpenApi\DeliverySchema }
            - { alias: ProblemViolation, type: App\NotificationPublisher\UserInterface\Http\OpenApi\ProblemViolationSchema }
    areas:
        default:
            path_patterns:
                - '^/health'
                - '^/notifications'
                - '^/users'
            disable_default_routes: true
