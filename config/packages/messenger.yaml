framework:
    messenger:
        failure_transport: failed
        default_bus: command.bus

        buses:
            command.bus:
                middleware:
                    - doctrine_transaction
            delivery.bus:
                middleware:
                    - doctrine_ping_connection

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 2000
                    multiplier: 3
                    max_delay: 300000
            # auto_setup=0 on both doctrine transports: the table comes from a migration, not a worker.
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        routing:
            App\NotificationPublisher\Application\Command\DeliverNotification: async

when@test:
    framework:
        messenger:
            transports:
                # delay 0 and one retry so a test worker can exhaust the strategy without sleeping.
                # Production stays on the delays above.
                async:
                    dsn: 'in-memory://'
                    retry_strategy:
                        max_retries: 1
                        delay: 0
                        multiplier: 1
                failed: 'in-memory://'
